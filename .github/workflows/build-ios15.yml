name: Build Flare iOS 15 IPA (TrollStore)

# 在 fork 里：Actions 标签 → 选中本工作流 → Run workflow 即可手动触发
on:
  workflow_dispatch:
  push:
    branches: [ ios15-build ]

jobs:
  build:
    # macOS 26 运行器预装 Xcode 26.x，满足 Flare 的 xcodeVersion: "26.0" 要求。
    # 公开仓库的 fork 跑 macOS 运行器免费。
    # 若你的账号没有 macos-26（标准 arm64）额度，可改用 macos-26-large（需付费/组织）
    # 或第三方 depot-macos-26（免费，需到 depot.dev 授权一次）。
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Kotlin Multiplatform 需要)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show Xcode version (调试用)
        run: xcodebuild -version

      - name: Install XcodeGen (把 project.yml 生成 .xcodeproj)
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd iosApp
          xcodegen generate

      - name: Build unsigned IPA (target iOS 15)
        run: |
          chmod +x gradlew
          xcodebuild \
            -project iosApp/Flare.xcodeproj \
            -scheme Flare \
            -configuration Release \
            -sdk iphoneos \
            -archivePath /tmp/Flare.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r /tmp/Flare.xcarchive/Products/Applications/Flare.app Payload/
          zip -r Flare-iOS15.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flare-iOS15-ipa
          path: Flare-iOS15.ipa
