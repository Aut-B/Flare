name: Build Flare iOS 15 IPA (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [ ios15-build ]

jobs:
  build:
    # GitHub 官方 macOS 26 运行器，预装 Xcode 26.6（Swift 6.2）。
    # 上游用 xcode-27 标签（自托管/付费），免费账号用 macos-26 即可。
    runs-on: macos-26

    env:
      GRADLE_JVM_ARGS: "-Xmx12G -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Kotlin Multiplatform 需要)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show Xcode version (调试用)
        run: xcodebuild -version

      - name: Download iOS device SDK (确保 iphoneos 可用)
        run: xcodebuild -downloadPlatform iOS

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project (appleApp)
        run: |
          cd appleApp
          xcodegen generate

      - name: Build unsigned IPA (iOS 15, device)
        run: |
          chmod +x gradlew
          cd appleApp
          xcodebuild \
            -project Flare.xcodeproj \
            -scheme iOS \
            -configuration Release \
            -sdk iphoneos \
            -archivePath /tmp/Flare.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r /tmp/Flare.xcarchive/Products/Applications/Flare.app Payload/
          zip -r Flare-iOS15.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flare-iOS15-ipa
          path: Flare-iOS15.ipa
